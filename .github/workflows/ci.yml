name: CI

# Três verificações, três jobs, de propósito.
#
# Elas falham por motivos diferentes e custam tempos muito diferentes: as sondas de
# RLS levam segundos e provam as policies do banco; os testes de unidade levam
# minutos e provam a lógica; os de interface levam mais do que os dois somados e
# provam as rotas e as affordances. Num job só, o log dizia "falhou" e alguém tinha de
# procurar qual dos três.
#
# Os de interface rodam apenas em PR para `main`. Em `dev` o ciclo é curto e os
# unitários pegam quase tudo; antes da versão que vai para a loja, vale esperar.
#
# ATENÇÃO AO RENOMEAR UM JOB. O `name:` de cada um é o nome pelo qual os rulesets de
# `main` e de `dev` exigem o check. Trocar o texto aqui sem trocar lá deixa o PR
# eternamente em "Expected — Waiting for status to be reported", porque o GitHub
# espera um check que não existe mais. Já aconteceu uma vez, ao dividir este arquivo
# em três jobs.
#
#   dev  exige: Testes de unidade · Sondas de RLS
#   main exige: Testes de unidade · Testes de interface · Sondas de RLS

on:
  # Só em pull request. Um gatilho de push dispara uma execução paralela, porque a
  # ref é outra, e as duas conferem exatamente o mesmo commit. O que protege o main
  # é o PR passar antes de mesclar.
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Testes de unidade
    # iOS 26 precisa de Xcode 26. Se este runner não existir mais, ou se a imagem
    # mudar de Xcode padrão, é aqui que se ajusta -- e o passo abaixo imprime o que
    # está instalado justamente para o log dizer o motivo em vez de "falhou".
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      - name: Xcode disponível
        run: |
          ls /Applications | grep -i '^Xcode' || true
          xcodebuild -version

      # SupabaseSecrets.swift e Config.xcconfig são gitignored de propósito: a anon
      # key vai dentro do binário, mas não dentro do repositório. O CI recria os dois
      # a partir de secrets, sem nunca ecoá-los.
      - name: Recriar segredos locais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e SUPABASE_ANON_KEY."
            exit 1
          fi
          cat > "Baluarte/Core/SupabaseSecrets.swift" <<SWIFT
          import Foundation

          enum SupabaseSecrets {
              static let projectURL = "${SUPABASE_URL}"
              static let anonKey = "${SUPABASE_ANON_KEY}"
          }
          SWIFT
          cp Config.xcconfig.template Config.xcconfig
          sed -i '' "s|SUPABASE_URL = .*|SUPABASE_URL = ${SUPABASE_URL}|" Config.xcconfig
          sed -i '' "s|SUPABASE_ANON_KEY = .*|SUPABASE_ANON_KEY = ${SUPABASE_ANON_KEY}|" Config.xcconfig

      # O gargalo não eram os UITests: é compilar o app, o supabase-swift e as sete
      # dependências dele do zero a cada execução. O SourcePackages é resolvido a
      # partir do Package.resolved, então a chave é o hash dele.
      - name: Cache das dependências
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # DerivedData carrega os módulos já compilados. A chave inclui o hash das
      # fontes para não reusar objeto velho; o restore-key deixa o build incremental
      # aproveitar o que não mudou. Os dois jobs de macOS compartilham a chave: o
      # primeiro a terminar grava, o outro aproveita na execução seguinte.
      - name: Cache do build
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Baluarte-*/Build
          key: build-${{ runner.os }}-${{ hashFiles('Baluarte/**/*.swift', 'BaluarteWidgets/**/*.swift', '**/Package.resolved') }}
          restore-keys: build-${{ runner.os }}-

      - name: Resolver dependências
        run: xcodebuild -resolvePackageDependencies -project Baluarte.xcodeproj

      - name: Testes de unidade
        run: |
          set -o pipefail
          # Idioma fixo, e de propósito não é o do código-fonte: um teste que compare
          # contra uma frase em português passa em pt-BR mesmo estando errado. Em
          # inglês ele quebra, que é o que queremos que aconteça aqui e não em produção.
          xcodebuild -scheme Baluarte \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -testLanguage en -testRegion US \
            -skip-testing:BaluarteUITests \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Build do widget
        run: |
          set -o pipefail
          xcodebuild -scheme BaluarteWidgetsExtension \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult-unit
          path: TestResults.xcresult
          retention-days: 7

  ui:
    name: Testes de interface
    runs-on: macos-26
    timeout-minutes: 60
    # Só antes da loja. Eles abrem o app dezessete vezes num simulador, e isso custa
    # mais do que todo o resto junto -- em `dev` o retorno não paga a espera.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v5

      - name: Recriar segredos locais
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e SUPABASE_ANON_KEY."
            exit 1
          fi
          cat > "Baluarte/Core/SupabaseSecrets.swift" <<SWIFT
          import Foundation

          enum SupabaseSecrets {
              static let projectURL = "${SUPABASE_URL}"
              static let anonKey = "${SUPABASE_ANON_KEY}"
          }
          SWIFT
          cp Config.xcconfig.template Config.xcconfig
          sed -i '' "s|SUPABASE_URL = .*|SUPABASE_URL = ${SUPABASE_URL}|" Config.xcconfig
          sed -i '' "s|SUPABASE_ANON_KEY = .*|SUPABASE_ANON_KEY = ${SUPABASE_ANON_KEY}|" Config.xcconfig

      - name: Cache das dependências
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Cache do build
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/Baluarte-*/Build
          key: build-${{ runner.os }}-${{ hashFiles('Baluarte/**/*.swift', 'BaluarteWidgets/**/*.swift', '**/Package.resolved') }}
          restore-keys: build-${{ runner.os }}-

      - name: Resolver dependências
        run: xcodebuild -resolvePackageDependencies -project Baluarte.xcodeproj

      - name: Testes de interface
        run: |
          set -o pipefail
          # O app abre com serviços determinísticos (`-uitest`), sem rede e sem sessão
          # real: ver Baluarte/Core/UITestSupport.swift.
          xcodebuild -scheme Baluarte \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -testLanguage en -testRegion US \
            -only-testing:BaluarteUITests \
            -resultBundlePath UITestResults.xcresult \
            test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult-ui
          path: UITestResults.xcresult
          retention-days: 7

  rls:
    name: Sondas de RLS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Um fork não recebe os secrets, e sem eles o script não tem o que sondar. Falhar
    # aí seria ruído.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v5

      # As sondas só leem ou tentam escrever esperando recusa, então rodar contra o
      # projeto real não deixa rastro. É de propósito: um banco de teste com outras
      # policies não provaria nada sobre o que está no ar.
      - name: Rodar a matriz
        env:
          BALUARTE_URL: ${{ secrets.SUPABASE_URL }}
          BALUARTE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RLS_USER_A_EMAIL: ${{ secrets.RLS_USER_A_EMAIL }}
          RLS_USER_A_PASSWORD: ${{ secrets.RLS_USER_A_PASSWORD }}
          RLS_USER_B_EMAIL: ${{ secrets.RLS_USER_B_EMAIL }}
          RLS_USER_B_PASSWORD: ${{ secrets.RLS_USER_B_PASSWORD }}
          # Opcionais: sem eles as duas sondas que precisam de um terceiro ator são
          # puladas com aviso, em vez de somarem verdes que não provam nada.
          RLS_USER_C_EMAIL: ${{ secrets.RLS_USER_C_EMAIL }}
          RLS_USER_C_PASSWORD: ${{ secrets.RLS_USER_C_PASSWORD }}
        run: |
          # As contas de teste podem ainda não existir. Falhar por isso deixaria o CI
          # vermelho por um motivo que não é defeito do código, e um vermelho
          # permanente é um vermelho que ninguém lê. Avisa e passa -- mas o aviso
          # fica no resumo da execução, para a ausência de cobertura não sumir.
          if [ -z "${RLS_USER_A_EMAIL:-}" ] || [ -z "${RLS_USER_B_EMAIL:-}" ]; then
            echo "::warning title=Sondas de RLS não rodaram::Faltam os secrets das contas de teste (RLS_USER_A_* e RLS_USER_B_*). As políticas do banco não foram verificadas nesta execução."
            echo "### ⚠️ Sondas de RLS puladas" >> "$GITHUB_STEP_SUMMARY"
            echo "As contas de teste não estão configuradas, então as políticas do banco não foram verificadas." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          supabase/tests/rls.sh
